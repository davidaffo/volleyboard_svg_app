name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example 0.6.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$tag"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag $tag does not match manifest.json version $manifest_version" >&2
            exit 1
          fi
          notes=".github/release-notes/${tag}.md"
          if [ ! -f "$notes" ]; then
            notes=".github/release-notes/default.md"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Validate release assets
        shell: bash
        run: |
          test -f main.js
          test -f styles.css
          test -f manifest.json
          node --check main.js

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "VolleyBoard SVG ${VERSION}" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              main.js styles.css manifest.json \
              --title "VolleyBoard SVG ${VERSION}" \
              --notes-file "$NOTES"
          fi
          gh release upload "$TAG" main.js styles.css manifest.json --clobber

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
